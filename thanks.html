<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terima Kasih!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    .thank-you-container {
      max-width: 600px;
      margin: auto;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .thank-you-img {
      width: 120px;
      margin-bottom: 20px;
    }

    .thank-you-title {
      font-size: 2rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .thank-you-desc {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 30px;
    }

    .btn-home {
      background-color: #6c63ff;
      border: none;
      padding: 10px 20px;
      font-weight: 500;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .btn-home:hover {
      background-color: #574b90;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="text-center my-5">
    <i class="fas fa-check-circle text-success" style="font-size: 100px;"></i>
    <h2 class="mt-4">Terima kasih!</h2>
    <p>Email Anda telah berhasil dikirim. Kami akan segera menghubungi Anda kembali.</p>
    <a href="https://izam182.github.io/" class="btn btn-primary mt-3">
      Kembali ke Halaman Utama
    </a>
  </div>


</body>
</html>
